services:
  - type: web
    name: cnpj-consulta-web
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m alembic upgrade head
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cnpj-consulta-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

  - type: worker
    name: cnpj-consulta-worker
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker.main
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cnpj-consulta-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: cnpj-consulta-db
    plan: 0.1c-256mb
    ipAllowList: []
    connectionPool: none

services:
  - type: web
    name: cnpj-consulta-web
    runtime: python
    region: virginia
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cnpj-consulta-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: cnpj-consulta-db
    region: virginia
    plan: free
    ipAllowList: []
    connectionPool: none
